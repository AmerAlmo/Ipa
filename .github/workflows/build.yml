name: Make IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Create App Files
        run: |
          cat << 'EOF' > project.yml
          name: GameTranslator
          options:
            bundleIdPrefix: com.ipad.translator
            deploymentTarget:
              iOS: "15.0"
          targets:
            GameTranslator:
              type: application
              platform: iOS
              sources:
                - App.swift
              settings:
                base:
                  TARGETED_DEVICE_FAMILY: "1,2"
              info:
                path: Info.plist
                properties:
                  UILaunchScreen: {}
                  UIRequiresFullScreen: true
                  UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  UISupportedInterfaceOrientations~ipad:
                    - UIInterfaceOrientationPortrait
                    - UIInterfaceOrientationPortraitUpsideDown
                    - UIInterfaceOrientationLandscapeLeft
                    - UIInterfaceOrientationLandscapeRight
                  NSAppTransportSecurity:
                    NSAllowsArbitraryLoads: true
          EOF

          cat << 'EOF' > App.swift
          import SwiftUI
          import WebKit
          import Vision

          @main
          struct GameTranslatorApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .statusBar(hidden: false)
                  }
              }
          }

          class BrowserViewModel: ObservableObject {
              @Published var urlString: String = "https://www.google.com"
              @Published var isAutoTranslating: Bool = false
              @Published var isEditingRegion: Bool = false
              @Published var translatedText: String = ""
              @Published var region: CGRect = CGRect(x: 0.12, y: 0.65, width: 0.76, height: 0.22)

              private var lastNormalizedText: String = ""
              private var isBusy: Bool = false
              private var timer: Timer?
              weak var webView: WKWebView?

              func loadURL() {
                  var formatted = urlString.trimmingCharacters(in: .whitespacesAndNewlines)
                  if !formatted.hasPrefix("http://") && !formatted.hasPrefix("https://") {
                      formatted = "https://" + formatted
                  }
                  if let url = URL(string: formatted) {
                      webView?.load(URLRequest(url: url))
                  }
              }

              func toggleAutoTranslate() {
                  isAutoTranslating.toggle()
                  if isAutoTranslating {
                      isEditingRegion = false
                      lastNormalizedText = ""
                      startTimer()
                      captureAndTranslate(force: true)
                  } else {
                      stopTimer()
                      translatedText = ""
                      lastNormalizedText = ""
                  }
              }

              private func startTimer() {
                  stopTimer()
                  timer = Timer.scheduledTimer(withTimeInterval: 0.85, repeats: true) { [weak self] _ in
                      self?.captureAndTranslate(force: false)
                  }
              }

              private func stopTimer() {
                  timer?.invalidate()
                  timer = nil
              }

              func captureAndTranslate(force: Bool = false) {
                  guard let webView = webView, !isBusy else { return }
                  isBusy = true

                  let config = WKSnapshotConfiguration()
                  webView.takeSnapshot(with: config) { [weak self] image, _ in
                      guard let self = self, let cgImage = image?.cgImage else {
                          self?.isBusy = false
                          return
                      }

                      let imgW = CGFloat(cgImage.width)
                      let imgH = CGFloat(cgImage.height)
                      let cropRect = CGRect(
                          x: self.region.origin.x * imgW,
                          y: self.region.origin.y * imgH,
                          width: self.region.size.width * imgW,
                          height: self.region.size.height * imgH
                      ).integral

                      guard let croppedCGImage = cgImage.cropping(to: cropRect) else {
                          self.isBusy = false
                          return
                      }

                      self.recognizeText(in: croppedCGImage, force: force)
                  }
              }

              private func recognizeText(in cgImage: CGImage, force: Bool) {
                  let request = VNRecognizeTextRequest { [weak self] req, _ in
                      guard let self = self,
                            let results = req.results as? [VNRecognizedTextObservation] else {
                          DispatchQueue.main.async { self?.isBusy = false }
                          return
                      }

                      let sorted = results.sorted { $0.boundingBox.origin.y > $1.boundingBox.origin.y }
                      var lines: [String] = []
                      for obs in sorted {
                          if let top = obs.topCandidates(1).first {
                              let txt = top.string.trimmingCharacters(in: .whitespacesAndNewlines)
                              if txt.count >= 2 {
                                  lines.append(txt)
                              }
                          }
                      }

                      let fullText = lines.joined(separator: "\n")
                      let normalized = fullText.lowercased().filter { $0.isLetter || $0.isNumber }

                      if normalized.isEmpty {
                          DispatchQueue.main.async {
                              self.translatedText = ""
                              self.lastNormalizedText = ""
                              self.isBusy = false
                          }
                          return
                      }

                      if !force && normalized == self.lastNormalizedText {
                          DispatchQueue.main.async {
                              self.isBusy = false
                          }
                          return
                      }

                      self.lastNormalizedText = normalized
                      self.translateText(fullText)
                  }

                  request.recognitionLevel = .accurate
                  request.usesLanguageCorrection = true
                  request.recognitionLanguages = ["en-US", "ja-JP", "zh-Hans", "ko-KR", "es-ES", "fr-FR", "de-DE"]

                  DispatchQueue.global(qos: .userInitiated).async {
                      try? VNImageRequestHandler(cgImage: cgImage, options: [:]).perform([request])
                  }
              }

              private func translateText(_ text: String) {
                  guard let enc = text.addingPercentEncoding(withAllowedCharacters: .urlQueryAllowed),
                        let url = URL(string: "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=ar&dt=t&q=\(enc)") else {
                      DispatchQueue.main.async { self.isBusy = false }
                      return
                  }

                  URLSession.shared.dataTask(with: url) { [weak self] data, _, _ in
                      var res = text
                      if let data = data,
                         let json = try? JSONSerialization.jsonObject(with: data) as? [Any],
                         let arr = json.first as? [[Any]] {
                          res = arr.compactMap { $0.first as? String }.joined()
                      }
                      DispatchQueue.main.async {
                          guard let self = self else { return }
                          if self.isAutoTranslating {
                              self.translatedText = res
                          }
                          self.isBusy = false
                      }
                  }.resume()
              }
          }

          struct WebViewWrapper: UIViewRepresentable {
              @ObservedObject var vm: BrowserViewModel
              func makeUIView(context: Context) -> WKWebView {
                  let prefs = WKWebpagePreferences()
                  prefs.allowsContentJavaScript = true
                  prefs.preferredContentMode = .desktop

                  let config = WKWebViewConfiguration()
                  config.defaultWebpagePreferences = prefs
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  let wv = WKWebView(frame: .zero, configuration: config)
                  wv.allowsBackForwardNavigationGestures = true
                  wv.scrollView.contentInsetAdjustmentBehavior = .never
                  vm.webView = wv
                  if let url = URL(string: vm.urlString) { wv.load(URLRequest(url: url)) }
                  return wv
              }
              func updateUIView(_ uiView: WKWebView, context: Context) {}
          }

          struct ContentView: View {
              @StateObject private var vm = BrowserViewModel()
              @State private var showBar = true
              @State private var dragStartRegion: CGRect? = nil
              @State private var resizeStartRegion: CGRect? = nil

              var body: some View {
                  ZStack {
                      VStack(spacing: 0) {
                          if showBar {
                              HStack(spacing: 10) {
                                  Button(action: { vm.webView?.goBack() }) {
                                      Image(systemName: "chevron.backward").font(.system(size: 18, weight: .semibold)).padding(8)
                                  }
                                  Button(action: { vm.webView?.reload() }) {
                                      Image(systemName: "arrow.clockwise").font(.system(size: 18, weight: .semibold)).padding(8)
                                  }
                                  TextField("أدخل رابط اللعبة...", text: $vm.urlString, onCommit: { vm.loadURL() })
                                      .textFieldStyle(RoundedBorderTextFieldStyle())
                                      .font(.system(size: 16))
                                      .autocapitalization(.none)
                                      .disableAutocorrection(true)
                                  Button("ذهاب") { vm.loadURL() }
                                      .font(.system(size: 16, weight: .bold))
                                      .padding(.horizontal, 14).padding(.vertical, 8)
                                      .background(Color.blue).foregroundColor(.white).cornerRadius(8)
                              }
                              .padding(.horizontal, 14)
                              .padding(.vertical, 8)
                              .background(Color(UIColor.secondarySystemBackground))
                          }

                          GeometryReader { geo in
                              let boxW = vm.region.size.width * geo.size.width
                              let boxH = vm.region.size.height * geo.size.height
                              let boxX = (vm.region.origin.x * geo.size.width) + (boxW / 2)
                              let boxY = (vm.region.origin.y * geo.size.height) + (boxH / 2)

                              ZStack {
                                  WebViewWrapper(vm: vm)

                                  // Crisp Movie Subtitle Overlay
                                  if vm.isAutoTranslating && !vm.translatedText.isEmpty && !vm.isEditingRegion {
                                      Text(vm.translatedText)
                                          .font(.system(size: 22, weight: .bold))
                                          .foregroundColor(.white)
                                          .shadow(color: .black, radius: 2, x: 0, y: 1)
                                          .multilineTextAlignment(.center)
                                          .padding(.horizontal, 18)
                                          .padding(.vertical, 12)
                                          .frame(maxWidth: boxW)
                                          .background(Color.black.opacity(0.82))
                                          .cornerRadius(12)
                                          .position(x: boxX, y: boxY)
                                          .allowsHitTesting(false)
                                  }

                                  // Region Selector Editor
                                  if vm.isEditingRegion {
                                      ZStack(alignment: .bottomTrailing) {
                                          Rectangle()
                                              .fill(Color.green.opacity(0.22))
                                              .border(Color.green, width: 3)
                                              .overlay(
                                                  Text("اسحب الصندوق لتحريكه فوق الحوار\nواسحب الدائرة بالزاوية لتغيير الحجم")
                                                      .font(.system(size: 16, weight: .bold))
                                                      .foregroundColor(.white)
                                                      .multilineTextAlignment(.center)
                                                      .padding(8)
                                                      .background(Color.black.opacity(0.75))
                                                      .cornerRadius(8)
                                              )
                                              .gesture(
                                                  DragGesture()
                                                      .onChanged { value in
                                                          if dragStartRegion == nil { dragStartRegion = vm.region }
                                                          guard let start = dragStartRegion else { return }
                                                          let dx = value.translation.width / geo.size.width
                                                          let dy = value.translation.height / geo.size.height
                                                          let nx = min(max(0.0, start.origin.x + dx), 1.0 - start.size.width)
                                                          let ny = min(max(0.0, start.origin.y + dy), 1.0 - start.size.height)
                                                          vm.region.origin = CGPoint(x: nx, y: ny)
                                                      }
                                                      .onEnded { _ in dragStartRegion = nil }
                                              )

                                          Circle()
                                              .fill(Color.green)
                                              .frame(width: 38, height: 38)
                                              .overlay(Image(systemName: "arrow.up.left.and.arrow.down.right").foregroundColor(.black).font(.system(size: 16, weight: .bold)))
                                              .offset(x: 14, y: 14)
                                              .gesture(
                                                  DragGesture()
                                                      .onChanged { value in
                                                          if resizeStartRegion == nil { resizeStartRegion = vm.region }
                                                          guard let start = resizeStartRegion else { return }
                                                          let dw = value.translation.width / geo.size.width
                                                          let dh = value.translation.height / geo.size.height
                                                          let nw = min(max(0.15, start.size.width + dw), 1.0 - start.origin.x)
                                                          let nh = min(max(0.08, start.size.height + dh), 1.0 - start.origin.y)
                                                          vm.region.size = CGSize(width: nw, height: nh)
                                                      }
                                                      .onEnded { _ in resizeStartRegion = nil }
                                              )
                                      }
                                      .frame(width: boxW, height: boxH)
                                      .position(x: boxX, y: boxY)
                                  }
                              }
                          }
                      }

                      // Floating Bottom Controls (Properly padded for iPad screen)
                      VStack {
                          Spacer()
                          HStack(spacing: 12) {
                              Button(action: { withAnimation { showBar.toggle() } }) {
                                  Image(systemName: "arrow.up.left.and.arrow.down.right")
                                      .font(.system(size: 18, weight: .bold))
                                      .padding(14)
                                      .background(Color.gray.opacity(0.85))
                                      .foregroundColor(.white)
                                      .clipShape(Circle())
                              }

                              Spacer()

                              Button(action: {
                                  vm.isEditingRegion.toggle()
                                  if vm.isEditingRegion { vm.isAutoTranslating = false }
                              }) {
                                  HStack(spacing: 8) {
                                      Image(systemName: vm.isEditingRegion ? "checkmark.circle.fill" : "viewfinder")
                                      Text(vm.isEditingRegion ? "تثبيت المنطقة" : "تحديد المنطقة")
                                  }
                                  .font(.system(size: 16, weight: .bold))
                                  .padding(.horizontal, 18).padding(.vertical, 12)
                                  .background(vm.isEditingRegion ? Color.green : Color.orange)
                                  .foregroundColor(.white)
                                  .cornerRadius(25)
                                  .shadow(radius: 3)
                              }

                              Button(action: { vm.toggleAutoTranslate() }) {
                                  HStack(spacing: 8) {
                                      Image(systemName: vm.isAutoTranslating ? "pause.circle.fill" : "play.circle.fill")
                                      Text(vm.isAutoTranslating ? "إيقاف التلقائي" : "ترجمة تلقائية")
                                  }
                                  .font(.system(size: 16, weight: .bold))
                                  .padding(.horizontal, 18).padding(.vertical, 12)
                                  .background(vm.isAutoTranslating ? Color.red : Color.blue)
                                  .foregroundColor(.white)
                                  .cornerRadius(25)
                                  .shadow(radius: 3)
                              }
                          }
                          .padding(.horizontal, 24)
                          .padding(.bottom, 16)
                      }
                  }
              }
          }
          EOF

      - name: Build and Package IPA
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project GameTranslator.xcodeproj -scheme GameTranslator -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/GameTranslator.app Payload/
          zip -r GameTranslator.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ready-GameTranslator-IPA
          path: GameTranslator.ipa
