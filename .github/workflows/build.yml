                                                  guard let start = subDragStart else { return }
                                                  let dx = value.translation.width / geo.size.width
                                                  let dy = value.translation.height / geo.size.height
                                                  let nx = min(max(0.1, start.x + dx), 0.9)
                                                  let ny = min(max(0.08, start.y + dy), 0.92)
                                                  vm.subPosition = CGPoint(x: nx, y: ny)
                                              }
                                              .onEnded { _ in subDragStart = nil }
                                      )
                                  }

                                  // 5. Draggable Assistive Ball when Controls are Hidden
                                  if hideControls {
                                      Button(action: { withAnimation(.spring()) { hideControls = false } }) {
                                          ZStack {
                                              Circle()
                                                  .fill(.ultraThinMaterial)
                                                  .frame(width: 48, height: 48)
                                                  .overlay(
                                                      Circle().stroke(vm.isAutoTranslating ? Color.cyan : Color.white.opacity(0.4), lineWidth: 2)
                                                  )
                                                  .shadow(color: .black.opacity(0.5), radius: 6)

                                              Image(systemName: "eye.slash.fill")
                                                  .font(.system(size: 18, weight: .bold))
                                                  .foregroundColor(.white)
                                          }
                                      }
                                      .position(ballPos)
                                      .highPriorityGesture(
                                          DragGesture()
                                              .onChanged { value in
                                                  if ballDragStart == nil { ballDragStart = ballPos }
                                                  guard let start = ballDragStart else { return }
                                                  let nx = min(max(30, start.x + value.translation.width), geo.size.width - 30)
                                                  let ny = min(max(30, start.y + value.translation.height), geo.size.height - 30)
                                                  ballPos = CGPoint(x: nx, y: ny)
                                              }
                                              .onEnded { _ in ballDragStart = nil }
                                      )
                                  }
                              }
                          }
                      }

                      // 6. Sleek Glassmorphic Floating Control Dock
                      if !hideControls && !vm.isPrivacyLocked {
                          VStack {
                              Spacer()
                              ScrollView(.horizontal, showsIndicators: false) {
                                  HStack(spacing: 8) {
                                      // Back Button
                                      Button(action: { vm.webView?.goBack() }) {
                                          Image(systemName: "arrow.uturn.backward")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(.white)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      // URL Bar Toggle
                                      Button(action: { withAnimation(.spring()) { showBar.toggle() } }) {
                                          Image(systemName: showBar ? "safari.fill" : "safari")
                                              .font(.system(size: 16, weight: .bold))
                                              .foregroundColor(showBar ? .cyan : .white)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      // Bookmarks
                                      Button(action: { showBookmarksSheet = true }) {
                                          Image(systemName: "star.fill")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(.yellow)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      // Save-State Backup Vault
                                      Button(action: { showSaveStatesSheet = true }) {
                                          Image(systemName: "externaldrive.fill.badge.checkmark")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(.green)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      // History Log
                                      Button(action: { showHistorySheet = true }) {
                                          Image(systemName: "clock.arrow.circlepath")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(.cyan)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      // Virtual PC Hotkeys Toggle
                                      Button(action: { withAnimation { vm.showVirtualKeys.toggle() } }) {
                                          Image(systemName: "gamecontroller.fill")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(vm.showVirtualKeys ? .orange : .white)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      // Voice-Over TTS Cycle (Off -> EN -> AR)
                                      Button(action: { vm.cycleTTSMode() }) {
                                          HStack(spacing: 3) {
                                              Image(systemName: vm.ttsMode == 0 ? "speaker.slash.fill" : "speaker.wave.2.fill")
                                              if vm.ttsMode > 0 {
                                                  Text(vm.ttsMode == 1 ? "EN" : "ع")
                                                      .font(.system(size: 11, weight: .heavy))
                                              }
                                          }
                                          .font(.system(size: 14, weight: .bold))
                                          .foregroundColor(vm.ttsMode > 0 ? .black : .white)
                                          .padding(.horizontal, 10)
                                          .frame(height: 38)
                                          .background(vm.ttsMode > 0 ? Color.green : Color.white.opacity(0.15))
                                          .clipShape(Capsule())
                                      }

                                      // Game Speedhack (1x / 1.5x / 2x)
                                      Button(action: { vm.cycleGameSpeed() }) {
                                          Text("\(String(format: "%g", vm.gameSpeed))x⚡")
                                              .font(.system(size: 13, weight: .heavy, design: .rounded))
                                              .foregroundColor(vm.gameSpeed > 1.0 ? .black : .white)
                                              .padding(.horizontal, 10)
                                              .frame(height: 38)
                                              .background(vm.gameSpeed > 1.0 ? Color.orange : Color.white.opacity(0.15))
                                              .clipShape(Capsule())
                                      }

                                      // Manga Auto-Scroll
                                      Button(action: { vm.toggleAutoScroll() }) {
                                          Image(systemName: vm.isAutoScrolling ? "pause.circle.fill" : "arrow.down.circle")
                                              .font(.system(size: 16, weight: .bold))
                                              .foregroundColor(vm.isAutoScrolling ? .green : .white)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      // Dual Subtitle + Tap-to-Define Toggle
                                      Button(action: { vm.showDualSubtitles.toggle() }) {
                                          Text("A/ع")
                                              .font(.system(size: 13, weight: .heavy, design: .rounded))
                                              .foregroundColor(vm.showDualSubtitles ? .black : .white)
                                              .padding(.horizontal, 10)
                                              .frame(height: 38)
                                              .background(vm.showDualSubtitles ? Color.cyan : Color.white.opacity(0.15))
                                              .clipShape(Capsule())
                                      }

                                      // HD Graphics Enhancer
                                      Button(action: { vm.toggleHDEnhancer() }) {
                                          HStack(spacing: 4) {
                                              Image(systemName: "sparkles")
                                              Text("HD")
                                          }
                                          .font(.system(size: 13, weight: .heavy, design: .rounded))
                                          .foregroundColor(vm.isHDEnhanced ? .black : .white)
                                          .padding(.horizontal, 10)
                                          .frame(height: 38)
                                          .background(vm.isHDEnhanced ? Color.yellow : Color.white.opacity(0.15))
                                          .clipShape(Capsule())
                                      }

                                      // Settings & Glossary & AI
                                      Button(action: { showSettingsSheet = true }) {
                                          Image(systemName: vm.useGeminiAI ? "brain.head.profile" : "gearshape.fill")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(vm.useGeminiAI ? .green : .white)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.15))
                                              .clipShape(Circle())
                                      }

                                      Divider().frame(height: 24).background(Color.white.opacity(0.3))

                                      // Region Selector
                                      Button(action: {
                                          withAnimation(.spring()) {
                                              vm.isEditingRegion.toggle()
                                              if vm.isEditingRegion {
                                                  vm.isAutoTranslating = false
                                                  vm.isFullScreenTranslated = false
                                              }
                                          }
                                      }) {
                                          HStack(spacing: 6) {
                                              Image(systemName: vm.isEditingRegion ? "checkmark.circle.fill" : "viewfinder")
                                              Text(vm.isEditingRegion ? "تثبيت" : "المنطقة")
                                          }
                                          .font(.system(size: 14, weight: .bold, design: .rounded))
                                          .foregroundColor(.white)
                                          .padding(.horizontal, 12)
                                          .frame(height: 38)
                                          .background(vm.isEditingRegion ? Color.green : Color.orange.opacity(0.9))
                                          .clipShape(Capsule())
                                      }

                                      // Auto Region Translate
                                      Button(action: { vm.toggleAutoTranslate() }) {
                                          HStack(spacing: 6) {
                                              Image(systemName: vm.isAutoTranslating ? "pause.fill" : "play.fill")
                                              Text(vm.isAutoTranslating ? "إيقاف التلقائي" : "ترجمة تلقائية")
                                          }
                                          .font(.system(size: 14, weight: .bold, design: .rounded))
                                          .foregroundColor(.white)
                                          .padding(.horizontal, 14)
                                          .frame(height: 38)
                                          .background(
                                              LinearGradient(
                                                  colors: vm.isAutoTranslating ? [.red, .pink] : [.blue, .cyan],
                                                  startPoint: .leading,
                                                  endPoint: .trailing
                                              )
                                          )
                                          .clipShape(Capsule())
                                      }

                                      // Full Screen Manga Translate
                                      Button(action: { vm.toggleFullScreenTranslate() }) {
                                          HStack(spacing: 6) {
                                              Image(systemName: vm.isFullScreenTranslated ? "xmark.circle.fill" : "doc.text.viewfinder")
                                              Text(vm.isFullScreenTranslated ? "إخفاء الشاشة" : "ترجمة الشاشة")
                                          }
                                          .font(.system(size: 14, weight: .bold, design: .rounded))
                                          .foregroundColor(.white)
                                          .padding(.horizontal, 14)
                                          .frame(height: 38)
                                          .background(
                                              LinearGradient(
                                                  colors: vm.isFullScreenTranslated ? [.purple, .pink] : [.indigo, .purple],
                                                  startPoint: .leading,
                                                  endPoint: .trailing
                                              )
                                          )
                                          .clipShape(Capsule())
                                      }

                                      // Boss / Privacy Lock Button
                                      Button(action: { withAnimation { vm.togglePrivacyLock() } }) {
                                          Image(systemName: "lock.shield.fill")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(.red)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.18))
                                              .clipShape(Circle())
                                      }

                                      // Hide Controls to Draggable Ball
                                      Button(action: { withAnimation(.spring()) { hideControls = true } }) {
                                          Image(systemName: "eye.fill")
                                              .font(.system(size: 15, weight: .bold))
                                              .foregroundColor(.white)
                                              .frame(width: 38, height: 38)
                                              .background(Color.white.opacity(0.2))
                                              .clipShape(Circle())
                                      }
                                  }
                                  .padding(.horizontal, 12)
                                  .padding(.vertical, 8)
                              }
                              .background(.ultraThinMaterial)
                              .clipShape(Capsule())
                              .overlay(Capsule().stroke(Color.white.opacity(0.2), lineWidth: 1))
                              .shadow(color: .black.opacity(0.45), radius: 10, x: 0, y: 5)
                              .padding(.horizontal, 16)
                              .padding(.bottom, 12)
                          }
                      }

                      // 7. Instant Privacy Boss Screen Shield
                      if vm.isPrivacyLocked {
                          ZStack {
                              Rectangle()
                                  .fill(.ultraThickMaterial)
                                  .ignoresSafeArea(.all)
                              VStack(spacing: 18) {
                                  Image(systemName: "lock.shield.fill")
                                      .font(.system(size: 64))
                                      .foregroundColor(.cyan)
                                  Text("وضع الخصوصية مفعّل (تم كتم الصوت وإخفاء الشاشة)")
                                      .font(.headline)
                                      .foregroundColor(.white)
                                  Button(action: { withAnimation { vm.togglePrivacyLock() } }) {
                                      Text("اضغط للعودة إلى اللعبة 🔓")
                                          .font(.system(size: 17, weight: .bold))
                                          .padding(.horizontal, 28)
                                          .padding(.vertical, 14)
                                          .background(Color.blue)
                                          .foregroundColor(.white)
                                          .clipShape(Capsule())
                                  }
                              }
                          }
                      }
                  }
                  // Sheet 1: Bookmarks
                  .sheet(isPresented: $showBookmarksSheet) {
                      NavigationView {
                          VStack {
                              HStack {
                                  TextField("اسم اللعبة أو المانجا لحفظها...", text: $newBookmarkTitle)
                                      .textFieldStyle(RoundedBorderTextFieldStyle())
                                  Button("حفظ الصفحة ⭐") {
                                      vm.addCurrentBookmark(title: newBookmarkTitle)
                                      newBookmarkTitle = ""
                                  }
                                  .padding(.horizontal, 12).padding(.vertical, 8)
                                  .background(Color.blue).foregroundColor(.white).cornerRadius(8)
                              }.padding()

                              List {
                                  ForEach(vm.bookmarks) { item in
                                      Button(action: {
                                          vm.loadURL(item.url)
                                          showBookmarksSheet = false
                                      }) {
                                          VStack(alignment: .leading, spacing: 4) {
                                              Text(item.title).font(.headline).foregroundColor(.primary)
                                              Text(item.url).font(.caption).foregroundColor(.secondary).lineLimit(1)
                                          }
                                      }
                                  }
                                  .onDelete { idx in vm.bookmarks.remove(atOffsets: idx) }
                              }
                          }
                          .navigationTitle("المفضلة والروابط ⭐")
                          .toolbar { Button("إغلاق") { showBookmarksSheet = false } }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
                  // Sheet 2: Save-State Backup Vault
                  .sheet(isPresented: $showSaveStatesSheet) {
                      NavigationView {
                          VStack {
                              HStack {
                                  TextField("اسم التختيمة (مثال: الفصل الثاني)...", text: $newSaveStateTitle)
                                      .textFieldStyle(RoundedBorderTextFieldStyle())
                                  Button("نسخ احتياطي للتختيم 💾") {
                                      vm.backupCurrentSaveState(customName: newSaveStateTitle)
                                      newSaveStateTitle = ""
                                  }
                                  .padding(.horizontal, 12).padding(.vertical, 8)
                                  .background(Color.green).foregroundColor(.white).cornerRadius(8)
                              }.padding()

                              List {
                                  if vm.saveStates.isEmpty {
                                      Text("لا توجد تختيمات محفوظة بعد. اضغط على الزر الأخضر بالأعلى لحفظ تقدمك الحالي في اللعبة.")
                                          .foregroundColor(.secondary)
                                  } else {
                                      ForEach(vm.saveStates) { item in
                                          HStack {
                                              VStack(alignment: .leading, spacing: 4) {
                                                  Text(item.title).font(.headline)
                                                  Text("\(item.domain) • \(item.dateString)").font(.caption).foregroundColor(.secondary)
                                              }
                                              Spacer()
                                              Button("استرجاع التختيم 🔄") {
                                                  vm.restoreSaveState(item)
                                                  showSaveStatesSheet = false
                                              }
                                              .padding(.horizontal, 10).padding(.vertical, 6)
                                              .background(Color.blue).foregroundColor(.white).cornerRadius(8)
                                          }
                                      }
                                      .onDelete { idx in vm.saveStates.remove(atOffsets: idx) }
                                  }
                              }
                          }
                          .navigationTitle("خزنة حفظ تختيم الألعاب 💾")
                          .toolbar { Button("إغلاق") { showSaveStatesSheet = false } }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
                  // Sheet 3: Dialogue History
                  .sheet(isPresented: $showHistorySheet) {
                      NavigationView {
                          List {
                              if vm.history.isEmpty {
                                  Text("لا توجد حوارات مترجمة بعد في هذه الجلسة.")
                                      .foregroundColor(.secondary)
                              } else {
                                  ForEach(vm.history) { item in
                                      VStack(alignment: .trailing, spacing: 6) {
                                          if !item.speaker.isEmpty {
                                              Text(item.speaker).font(.caption.bold()).foregroundColor(.blue)
                                          }
                                          Text(item.translatedText)
                                              .font(.body.bold())
                                              .multilineTextAlignment(.trailing)
                                              .frame(maxWidth: .infinity, alignment: .trailing)
                                          Text(item.originalText)
                                              .font(.footnote)
                                              .foregroundColor(.secondary)
                                              .multilineTextAlignment(.leading)
                                              .frame(maxWidth: .infinity, alignment: .leading)
                                      }
                                      .padding(.vertical, 4)
                                  }
                              }
                          }
                          .navigationTitle("سجل الحوارات السابقة 📜")
                          .toolbar {
                              HStack {
                                  Button("مسح السجل") { vm.history.removeAll() }.foregroundColor(.red)
                                  Button("إغلاق") { showHistorySheet = false }
                              }
                          }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
                  // Sheet 4: Advanced Settings, Glossary & AI
                  .sheet(isPresented: $showSettingsSheet) {
                      NavigationView {
                          Form {
                              Section(header: Text("المعالجة البصرية وتوفير الطاقة")) {
                                  Toggle("فلتر تعزيز وضوح الحروف (CoreImage 🔬)", isOn: $vm.usePreProcessing)
                                  Toggle("حساس اللمس الذكي لتوفير البطارية (Eco 🔋)", isOn: $vm.useEcoTouchMode)
                                  Toggle("تبييض فقاعات المانجا تلقائياً (🎨)", isOn: $vm.mangaCleanBubbleMode)
                              }

                              Section(header: Text("قاموس تثبيت أسماء الشخصيات (Name Lock 📌)")) {
                                  HStack {
                                      TextField("الاسم الأجنبي (Jon)", text: $newGlossaryOrig)
                                          .autocapitalization(.none)
                                      TextField("المقابل العربي (جون)", text: $newGlossaryRep)
                                      Button("إضافة") {
                                          if !newGlossaryOrig.isEmpty && !newGlossaryRep.isEmpty {
                                              vm.glossary.append(GlossaryItem(original: newGlossaryOrig, replacement: newGlossaryRep))
                                              newGlossaryOrig = ""
                                              newGlossaryRep = ""
                                          }
                                      }
                                  }
                                  ForEach(vm.glossary) { g in
                                      HStack {
                                          Text(g.original).bold()
                                          Image(systemName: "arrow.left")
                                          Text(g.replacement).foregroundColor(.blue)
                                      }
                                  }
                                  .onDelete { idx in vm.glossary.remove(atOffsets: idx) }
                              }

                              Section(header: Text("حجم ولون خط الترجمة")) {
                                  HStack {
                                      Text("حجم الخط: \(Int(vm.fontSize))")
                                      Slider(value: $vm.fontSize, in: 14...36, step: 1)
                                  }
                                  Toggle("اللون الذهبي السينمائي للترجمة", isOn: $vm.isGoldenText)
                                  Toggle("النص المزدوج مع القاموس التفاعلي باللمس", isOn: $vm.showDualSubtitles)
                                  Button("إعادة مكان الترجمة فوق مربع المسح مباشرة") {
                                      vm.useCustomSubPos = false
                                  }
                              }

                              Section(header: Text("الترجمة الذكية بالذكاء الاصطناعي (Gemini AI 🧠)")) {
                                  Toggle("تفعيل ترجمة السياق الذكية (Gemini)", isOn: $vm.useGeminiAI)
                                  SecureField("أدخل مفتاح Gemini API المجاني (اختياري)", text: $vm.geminiApiKey)
                                      .autocapitalization(.none)
                              }

                              Section(header: Text("سرعة التمرير التلقائي للمانجا")) {
                                  HStack {
                                      Text("السرعة: \(String(format: "%.1f", vm.scrollSpeed))")
                                      Slider(value: $vm.scrollSpeed, in: 0.5...5.0, step: 0.5)
                                  }
                              }
                          }
                          .navigationTitle("الإعدادات المتقدمة والقاموس ⚙️")
                          .toolbar { Button("تم") { showSettingsSheet = false } }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
              }
          }
          EOF

      - name: Build and Package IPA
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project GameTranslatorUltra.xcodeproj \
            -scheme GameTranslatorUltra \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/GameTranslatorUltra.app Payload/
          zip -r GameTranslatorUltra.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ready-GameTranslatorUltra-IPA
          path: GameTranslatorUltra.ipa
