          // MARK: - Main ContentView
          struct ContentView: View {
              @StateObject private var vm = BrowserViewModel()
              @State private var showBar = false
              @State private var isOrbCollapsed = false
              @State private var showControlHub = false

              @State private var showBookmarksSheet = false
              @State private var showHistorySheet = false
              @State private var showSaveStatesSheet = false
              @State private var showSettingsSheet = false

              @State private var newBookmarkTitle = ""
              @State private var newSaveStateTitle = ""
              @State private var newGlossaryOrig = ""
              @State private var newGlossaryRep = ""

              @State private var dragStartRegion: CGRect? = nil
              @State private var resizeStartRegion: CGRect? = nil
              @State private var subDragStart: CGPoint? = nil

              @State private var floatingPos: CGPoint = CGPoint(x: 190, y: 60)
              @State private var floatingDragStart: CGPoint? = nil
              @State private var didSetInitialFloatingPos = false

              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea(.all)

                      VStack(spacing: 0) {
                          if showBar {
                              HStack(spacing: 10) {
                                  Button(action: { vm.webView?.goBack() }) {
                                      Image(systemName: "chevron.backward").font(.system(size: 18, weight: .bold)).foregroundColor(.white).padding(8)
                                  }
                                  Button(action: { vm.webView?.goForward() }) {
                                      Image(systemName: "chevron.forward").font(.system(size: 18, weight: .bold)).foregroundColor(.white).padding(8)
                                  }
                                  Button(action: { vm.webView?.reload() }) {
                                      Image(systemName: "arrow.clockwise").font(.system(size: 18, weight: .bold)).foregroundColor(.white).padding(8)
                                  }
                                  TextField("أدخل رابط اللعبة أو المانجا...", text: $vm.urlString, onCommit: { vm.loadURL() })
                                      .textFieldStyle(RoundedBorderTextFieldStyle())
                                      .font(.system(size: 16))
                                      .autocapitalization(.none)
                                      .disableAutocorrection(true)
                                  Button("ذهاب") { vm.loadURL() }
                                      .font(.system(size: 15, weight: .bold))
                                      .padding(.horizontal, 16).padding(.vertical, 8)
                                      .background(LinearGradient(colors: [.blue, .cyan], startPoint: .leading, endPoint: .trailing))
                                      .foregroundColor(.white)
                                      .cornerRadius(10)

                                  Button(action: { withAnimation { showBar = false } }) {
                                      Image(systemName: "xmark.circle.fill").font(.system(size: 20)).foregroundColor(.white.opacity(0.8)).padding(6)
                                  }
                              }
                              .padding(.horizontal, 18)
                              .padding(.vertical, 8)
                              .background(.ultraThinMaterial)
                          }

                          GeometryReader { geo in
                              let boxW = vm.region.size.width * geo.size.width
                              let boxH = vm.region.size.height * geo.size.height
                              let boxX = (vm.region.origin.x * geo.size.width) + (boxW / 2)
                              let boxY = (vm.region.origin.y * geo.size.height) + (boxH / 2)

                              let subX = vm.useCustomSubPos ? (vm.subPosition.x * geo.size.width) : boxX
                              let subY = vm.useCustomSubPos ? (vm.subPosition.y * geo.size.height) : boxY

                              ZStack {
                                  WebViewWrapper(
                                      vm: vm,
                                      onTwoFingerTap: { withAnimation { vm.hideSubtitlesTemp.toggle() } },
                                      onThreeFingerTap: { withAnimation(.spring()) { isOrbCollapsed.toggle() } }
                                  )
                                  .frame(width: geo.size.width, height: geo.size.height)
                                  .onAppear {
                                      if !didSetInitialFloatingPos {
                                          didSetInitialFloatingPos = true
                                          floatingPos = CGPoint(x: geo.size.width / 2, y: geo.size.height - 38)
                                      }
                                  }

                                  if vm.isAutoTranslating && !vm.translatedText.isEmpty && !vm.isEditingRegion && !vm.hideSubtitlesTemp {
                                      SubtitleOverlayView(vm: vm, boxW: boxW, screenW: geo.size.width, subX: subX, subY: subY)
                                  }

                                  if vm.isFullScreenTranslated && !vm.hideSubtitlesTemp {
                                      ForEach(vm.screenBoxes) { box in
                                          Text(box.translatedText)
                                              .font(.system(size: max(vm.fontSize - 4, 14), weight: .bold, design: .rounded))
                                              .foregroundColor(box.isLightBubble ? .black : vm.activeSubtitleColor)
                                              .multilineTextAlignment(.center)
                                              .environment(\.layoutDirection, .rightToLeft)
                                              .padding(6)
                                              .background(
                                                  RoundedRectangle(cornerRadius: box.isLightBubble ? 14 : 10, style: .continuous)
                                                      .fill(box.isLightBubble ? Color.white.opacity(0.96) : Color.black.opacity(vm.subBgOpacity))
                                                      .overlay(
                                                          RoundedRectangle(cornerRadius: box.isLightBubble ? 14 : 10, style: .continuous)
                                                              .stroke(box.isLightBubble ? Color.black.opacity(0.2) : vm.activeSubtitleColor.opacity(0.4), lineWidth: 1)
                                                      )
                                              )
                                              .frame(
                                                  width: max(box.rect.width * geo.size.width, 95),
                                                  height: max(box.rect.height * geo.size.height, 34)
                                              )
                                              .position(
                                                  x: box.rect.midX * geo.size.width,
                                                  y: box.rect.midY * geo.size.height
                                              )
                                              .allowsHitTesting(false)
                                      }
                                  }

                                  if vm.showVirtualKeys {
                                      VirtualHotkeysOverlay(vm: vm, screenSize: geo.size)
                                  }

                                  if vm.isEditingRegion {
                                      ZStack(alignment: .bottomTrailing) {
                                          RoundedRectangle(cornerRadius: 16, style: .continuous)
                                              .fill(Color.cyan.opacity(0.18))
                                              .overlay(
                                                  RoundedRectangle(cornerRadius: 16, style: .continuous)
                                                      .stroke(Color.cyan, style: StrokeStyle(lineWidth: 2.5, dash: [8, 4]))
                                              )
                                              .overlay(
                                                  VStack(spacing: 4) {
                                                      Image(systemName: "viewfinder").font(.system(size: 22, weight: .bold)).foregroundColor(.cyan)
                                                      Text("منطقة القراءة (اسحب المربع فوق كلام اللعبة)")
                                                          .font(.system(size: 14, weight: .bold, design: .rounded))
                                                          .foregroundColor(.white)
                                                  }
                                                  .padding(10)
                                                  .background(Color.black.opacity(0.75))
                                                  .cornerRadius(10)
                                              )
                                              .gesture(
                                                  DragGesture()
                                                      .onChanged { value in
                                                          if dragStartRegion == nil { dragStartRegion = vm.region }
                                                          guard let start = dragStartRegion else { return }
                                                          let dx = value.translation.width / geo.size.width
                                                          let dy = value.translation.height / geo.size.height
                                                          let nx = min(max(0.0, start.origin.x + dx), 1.0 - start.size.width)
                                                          let ny = min(max(0.0, start.origin.y + dy), 1.0 - start.size.height)
                                                          vm.region.origin = CGPoint(x: nx, y: ny)
                                                      }
                                                      .onEnded { _ in dragStartRegion = nil }
                                              )

                                          Circle()
                                              .fill(LinearGradient(colors: [.cyan, .blue], startPoint: .topLeading, endPoint: .bottomTrailing))
                                              .frame(width: 38, height: 38)
                                              .shadow(radius: 4)
                                              .overlay(Image(systemName: "arrow.up.left.and.arrow.down.right").foregroundColor(.white).font(.system(size: 15, weight: .bold)))
                                              .offset(x: 14, y: 14)
                                              .gesture(
                                                  DragGesture()
                                                      .onChanged { value in
                                                          if resizeStartRegion == nil { resizeStartRegion = vm.region }
                                                          guard let start = resizeStartRegion else { return }
                                                          let dw = value.translation.width / geo.size.width
                                                          let dh = value.translation.height / geo.size.height
                                                          let nw = min(max(0.15, start.size.width + dw), 1.0 - start.origin.x)
                                                          let nh = min(max(0.06, start.size.height + dh), 1.0 - start.origin.y)
                                                          vm.region.size = CGSize(width: nw, height: nh)
                                                      }
                                                      .onEnded { _ in resizeStartRegion = nil }
                                              )
                                      }
                                      .frame(width: boxW, height: boxH)
                                      .position(x: boxX, y: boxY)

                                      HStack(spacing: 8) {
                                          Image(systemName: "arrow.up.and.down.and.arrow.left.and.right").foregroundColor(.black)
                                          Text("مكان ظهور الترجمة العربية (اسحبني لأي مكان)")
                                              .font(.system(size: 15, weight: .bold, design: .rounded))
                                              .foregroundColor(.black)
                                      }
                                      .padding(.horizontal, 18)
                                      .padding(.vertical, 12)
                                      .background(vm.activeSubtitleColor)
                                      .cornerRadius(20)
                                      .shadow(color: .black.opacity(0.6), radius: 6)
                                      .position(x: subX, y: subY)
                                      .gesture(
                                          DragGesture()
                                              .onChanged { value in
                                                  vm.useCustomSubPos = true
                                                  if subDragStart == nil { subDragStart = vm.subPosition }
                                                  guard let start = subDragStart else { return }
                                                  let dx = value.translation.width / geo.size.width
                                                  let dy = value.translation.height / geo.size.height
                                                  let nx = min(max(0.1, start.x + dx), 0.9)
                                                  let ny = min(max(0.08, start.y + dy), 0.92)
                                                  vm.subPosition = CGPoint(x: nx, y: ny)
                                              }
                                              .onEnded { _ in subDragStart = nil }
                                      )
                                  }

                                  if !vm.statusToast.isEmpty {
                                      VStack {
                                          Text(vm.statusToast)
                                              .font(.system(size: 14, weight: .bold, design: .rounded))
                                              .foregroundColor(.white)
                                              .padding(.horizontal, 16)
                                              .padding(.vertical, 8)
                                              .background(Color.black.opacity(0.85))
                                              .clipShape(Capsule())
                                              .overlay(Capsule().stroke(Color.cyan.opacity(0.5), lineWidth: 1))
                                              .padding(.top, 14)
                                          Spacer()
                                      }
                                      .allowsHitTesting(false)
                                  }

                                  if showControlHub && !vm.isPrivacyLocked {
                                      ControlHubModalView(
                                          vm: vm,
                                          screenWidth: geo.size.width,
                                          showBar: $showBar,
                                          showControlHub: $showControlHub,
                                          showSaveStatesSheet: $showSaveStatesSheet,
                                          showHistorySheet: $showHistorySheet,
                                          showBookmarksSheet: $showBookmarksSheet,
                                          showSettingsSheet: $showSettingsSheet
                                      )
                                  }

                                  if !vm.isPrivacyLocked {
                                      Group {
                                          if isOrbCollapsed {
                                              Button(action: { withAnimation(.spring()) { isOrbCollapsed = false } }) {
                                                  ZStack {
                                                      Circle()
                                                          .fill(Color.black.opacity(0.72))
                                                          .frame(width: 46, height: 46)
                                                          .overlay(
                                                              Circle().stroke(
                                                                  vm.isAutoTranslating ? Color.cyan : Color.white.opacity(0.35),
                                                                  lineWidth: vm.isAutoTranslating ? 2.5 : 1.5
                                                              )
                                                          )
                                                          .shadow(color: .black.opacity(0.5), radius: 6)

                                                      VStack(spacing: 1) {
                                                          Image(systemName: vm.isAutoTranslating ? "waveform" : "globe")
                                                              .font(.system(size: 15, weight: .bold))
                                                              .foregroundColor(vm.isAutoTranslating ? .cyan : .white)
                                                          Text("ع")
                                                              .font(.system(size: 10, weight: .heavy))
                                                              .foregroundColor(vm.activeSubtitleColor)
                                                      }
                                                  }
                                              }
                                          } else {
                                              HStack(spacing: 8) {
                                                  Button(action: { vm.toggleAutoTranslate() }) {
                                                      HStack(spacing: 5) {
                                                          Image(systemName: vm.isAutoTranslating ? "pause.fill" : "play.fill")
                                                          Text(vm.isAutoTranslating ? "تلقائي" : "ترجم")
                                                      }
                                                      .font(.system(size: 13, weight: .bold, design: .rounded))
                                                      .foregroundColor(.white)
                                                      .padding(.horizontal, 12)
                                                      .frame(height: 36)
                                                      .background(
                                                          LinearGradient(
                                                              colors: vm.isAutoTranslating ? [.red, .pink] : [.blue, .cyan],
                                                              startPoint: .leading,
                                                              endPoint: .trailing
                                                          )
                                                      )
                                                      .clipShape(Capsule())
                                                  }

                                                  Button(action: {
                                                      withAnimation(.spring()) {
                                                          vm.isEditingRegion.toggle()
                                                          if vm.isEditingRegion { vm.isAutoTranslating = false }
                                                      }
                                                  }) {
                                                      Image(systemName: vm.isEditingRegion ? "checkmark.circle.fill" : "viewfinder")
                                                          .font(.system(size: 15, weight: .bold))
                                                          .foregroundColor(.white)
                                                          .frame(width: 36, height: 36)
                                                          .background(vm.isEditingRegion ? Color.green : Color.orange.opacity(0.85))
                                                          .clipShape(Circle())
                                                  }

                                                  Button(action: { vm.toggleFullScreenTranslate() }) {
                                                      Image(systemName: vm.isFullScreenTranslated ? "xmark.viewfinder" : "doc.text.viewfinder")
                                                          .font(.system(size: 15, weight: .bold))
                                                          .foregroundColor(.white)
                                                          .frame(width: 36, height: 36)
                                                          .background(vm.isFullScreenTranslated ? Color.purple : Color.indigo.opacity(0.85))
                                                          .clipShape(Circle())
                                                  }

                                                  Button(action: { vm.toggleGameTheaterZoom() }) {
                                                      Image(systemName: vm.isGameTheaterZoomed ? "arrow.down.right.and.arrow.up.left" : "arrow.up.left.and.arrow.down.right")
                                                          .font(.system(size: 14, weight: .bold))
                                                          .foregroundColor(vm.isGameTheaterZoomed ? .black : .white)
                                                          .frame(width: 36, height: 36)
                                                          .background(vm.isGameTheaterZoomed ? Color.cyan : Color.white.opacity(0.18))
                                                          .clipShape(Circle())
                                                  }

                                                  Button(action: { withAnimation(.spring()) { showControlHub.toggle() } }) {
                                                      Image(systemName: "square.grid.2x2.fill")
                                                          .font(.system(size: 15, weight: .bold))
                                                          .foregroundColor(showControlHub ? .cyan : .white)
                                                          .frame(width: 36, height: 36)
                                                          .background(Color.white.opacity(0.18))
                                                          .clipShape(Circle())
                                                  }

                                                  Button(action: { withAnimation(.spring()) { isOrbCollapsed = true; showControlHub = false } }) {
                                                      Image(systemName: "chevron.down.circle.fill")
                                                          .font(.system(size: 16, weight: .bold))
                                                          .foregroundColor(.white.opacity(0.75))
                                                          .frame(width: 32, height: 36)
                                                  }
                                              }
                                              .padding(.horizontal, 10)
                                              .padding(.vertical, 6)
                                              .background(.ultraThinMaterial)
                                              .clipShape(Capsule())
                                              .overlay(Capsule().stroke(Color.white.opacity(0.25), lineWidth: 1))
                                              .shadow(color: .black.opacity(0.5), radius: 8, x: 0, y: 4)
                                          }
                                      }
                                      .position(floatingPos)
                                      .highPriorityGesture(
                                          DragGesture()
                                              .onChanged { value in
                                                  if floatingDragStart == nil { floatingDragStart = floatingPos }
                                                  guard let start = floatingDragStart else { return }
                                                  let margin: CGFloat = isOrbCollapsed ? 28 : 130
                                                  let nx = min(max(margin, start.x + value.translation.width), geo.size.width - margin)
                                                  let ny = min(max(30, start.y + value.translation.height), geo.size.height - 30)
                                                  floatingPos = CGPoint(x: nx, y: ny)
                                              }
                                              .onEnded { _ in floatingDragStart = nil }
                                      )
                                  }
                              }
                          }
                      }

                      if vm.isPrivacyLocked {
                          ZStack {
                              Rectangle()
                                  .fill(.ultraThickMaterial)
                                  .ignoresSafeArea(.all)
                              VStack(spacing: 18) {
                                  Image(systemName: "lock.shield.fill")
                                      .font(.system(size: 64))
                                      .foregroundColor(.cyan)
                                  Text("وضع الخصوصية مفعّل (تم كتم الصوت وإخفاء الشاشة)")
                                      .font(.headline)
                                      .foregroundColor(.white)
                                  Button(action: { withAnimation { vm.togglePrivacyLock() } }) {
                                      Text("اضغط للعودة إلى اللعبة 🔓")
                                          .font(.system(size: 17, weight: .bold))
                                          .padding(.horizontal, 28)
                                          .padding(.vertical, 14)
                                          .background(Color.blue)
                                          .foregroundColor(.white)
                                          .clipShape(Capsule())
                                  }
                              }
                          }
                      }
                  }
                  .sheet(isPresented: $showBookmarksSheet) {
                      NavigationView {
                          VStack {
                              HStack {
                                  TextField("اسم اللعبة أو المانجا لحفظها...", text: $newBookmarkTitle)
                                      .textFieldStyle(RoundedBorderTextFieldStyle())
                                  Button("حفظ الصفحة ⭐") {
                                      vm.addCurrentBookmark(title: newBookmarkTitle)
                                      newBookmarkTitle = ""
                                  }
                                  .padding(.horizontal, 12).padding(.vertical, 8)
                                  .background(Color.blue).foregroundColor(.white).cornerRadius(8)
                              }.padding()

                              List {
                                  ForEach(vm.bookmarks) { item in
                                      Button(action: {
                                          vm.loadURL(item.url)
                                          showBookmarksSheet = false
                                      }) {
                                          VStack(alignment: .leading, spacing: 4) {
                                              Text(item.title).font(.headline).foregroundColor(.primary)
                                              Text(item.url).font(.caption).foregroundColor(.secondary).lineLimit(1)
                                          }
                                      }
                                  }
                                  .onDelete { idx in vm.bookmarks.remove(atOffsets: idx) }
                              }
                          }
                          .navigationTitle("المفضلة والروابط ⭐")
                          .toolbar { Button("إغلاق") { showBookmarksSheet = false } }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
                  .sheet(isPresented: $showSaveStatesSheet) {
                      NavigationView {
                          VStack {
                              HStack {
                                  TextField("اسم التختيمة (مثال: الفصل الثاني)...", text: $newSaveStateTitle)
                                      .textFieldStyle(RoundedBorderTextFieldStyle())
                                  Button("حفظ التختيم 💾") {
                                      vm.backupCurrentSaveState(customName: newSaveStateTitle)
                                      newSaveStateTitle = ""
                                  }
                                  .padding(.horizontal, 12).padding(.vertical, 8)
                                  .background(Color.green).foregroundColor(.white).cornerRadius(8)
                              }
                              .padding(.horizontal)
                              .padding(.top)

                              HStack {
                                  Button(action: { vm.importSaveStateFromClipboard() }) {
                                      HStack {
                                          Image(systemName: "doc.on.clipboard.fill")
                                          Text("استيراد تختيمة من الحافظة 📥")
                                      }
                                      .font(.system(size: 14, weight: .bold))
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 8)
                                      .background(Color.purple.opacity(0.15))
                                      .foregroundColor(.purple)
                                      .cornerRadius(8)
                                  }
                              }
                              .padding(.horizontal)

                              List {
                                  if vm.saveStates.isEmpty {
                                      Text("لا توجد تختيمات محفوظة بعد. يمكنك حفظ تختيمك أو نسخ كوده للملاحظات لحمايته عند حذف التطبيق.")
                                          .foregroundColor(.secondary)
                                  } else {
                                      ForEach(vm.saveStates) { item in
                                          HStack {
                                              VStack(alignment: .leading, spacing: 4) {
                                                  Text(item.title).font(.headline)
                                                  Text("\(item.domain) • \(item.dateString)").font(.caption).foregroundColor(.secondary)
                                              }
                                              Spacer()
                                              Button(action: { vm.exportSaveStateToClipboard(item) }) {
                                                  Image(systemName: "doc.on.doc")
                                                      .padding(8)
                                                      .background(Color.orange.opacity(0.2))
                                                      .foregroundColor(.orange)
                                                      .cornerRadius(8)
                                              }
                                              .buttonStyle(PlainButtonStyle())

                                              Button("استرجاع 🔄") {
                                                  vm.restoreSaveState(item)
                                                  showSaveStatesSheet = false
                                              }
                                              .padding(.horizontal, 10).padding(.vertical, 6)
                                              .background(Color.blue).foregroundColor(.white).cornerRadius(8)
                                              .buttonStyle(PlainButtonStyle())
                                          }
                                      }
                                      .onDelete { idx in vm.saveStates.remove(atOffsets: idx) }
                                  }
                              }
                          }
                          .navigationTitle("خزنة حفظ التختيم 💾")
                          .toolbar { Button("إغلاق") { showSaveStatesSheet = false } }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
                  .sheet(isPresented: $showHistorySheet) {
                      NavigationView {
                          List {
                              if vm.history.isEmpty {
                                  Text("لا توجد حوارات مترجمة بعد في هذه الجلسة.")
                                      .foregroundColor(.secondary)
                              } else {
                                  ForEach(vm.history) { item in
                                      VStack(alignment: .trailing, spacing: 6) {
                                          if !item.speaker.isEmpty {
                                              Text(item.speaker).font(.caption.bold()).foregroundColor(.blue)
                                          }
                                          Text(item.translatedText)
                                              .font(.body.bold())
                                              .multilineTextAlignment(.trailing)
                                              .frame(maxWidth: .infinity, alignment: .trailing)
                                          Text(item.originalText)
                                              .font(.footnote)
                                              .foregroundColor(.secondary)
                                              .multilineTextAlignment(.leading)
                                              .frame(maxWidth: .infinity, alignment: .leading)
                                      }
                                      .padding(.vertical, 4)
                                  }
                              }
                          }
                          .navigationTitle("سجل الحوارات السابقة 📜")
                          .toolbar {
                              HStack {
                                  Button("مسح السجل") { vm.history.removeAll() }.foregroundColor(.red)
                                  Button("إغلاق") { showHistorySheet = false }
                              }
                          }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
                  .sheet(isPresented: $showSettingsSheet) {
                      NavigationView {
                          Form {
                              Section(header: Text("استوديو ألوان وشكل الترجمة 🎨")) {
                                  Picker("لون خط الترجمة", selection: $vm.colorPresetIndex) {
                                      ForEach(SubColorPreset.allCases, id: \.rawValue) { preset in
                                          Text(preset.name).tag(preset.rawValue)
                                      }
                                  }

                                  if vm.colorPresetIndex == SubColorPreset.custom.rawValue {
                                      ColorPicker("اختر لونك المفضل للخط", selection: $vm.customTextColor, supportsOpacity: false)
                                  }

                                  HStack {
                                      Text("حجم الخط: \(Int(vm.fontSize))")
                                      Slider(value: $vm.fontSize, in: 14...38, step: 1)
                                  }

                                  HStack {
                                      Text("عتامة خلفية النص: \(Int(vm.subBgOpacity * 100))%")
                                      Slider(value: $vm.subBgOpacity, in: 0.2...1.0, step: 0.05)
                                  }

                                  Toggle("النص المزدوج مع القاموس التفاعلي باللمس", isOn: $vm.showDualSubtitles)
                                  Button("إعادة مكان الترجمة فوق مربع المسح مباشرة") {
                                      vm.useCustomSubPos = false
                                  }
                              }

                              Section(header: Text("سرعة الترجمة ومحرك القراءة (Turbo OCR ⚡)")) {
                                  Picker("لغة اللعبة الأصلية", selection: $vm.ocrLanguageMode) {
                                      Text("إنجليزي / أوروبي (الأسرع ⚡)").tag(0)
                                      Text("ياباني / صيني / كوري + إنجليزي").tag(1)
                                  }
                                  Toggle("وضع القراءة الفائقة السرعة (Fast OCR 🚀)", isOn: $vm.useFastOCR)
                                  Toggle("فلتر تباين الحروف للخلفيات المعقدة (🔬)", isOn: $vm.usePreProcessing)
                                  Toggle("توفير البطارية الذكي عند ثبات الشاشة (🔋)", isOn: $vm.useEcoTouchMode)
                                  Toggle("تبييض فقاعات المانجا تلقائياً (🎨)", isOn: $vm.mangaCleanBubbleMode)
                              }

                              Section(header: Text("قاموس تثبيت أسماء الشخصيات (Name Lock 📌)")) {
                                  HStack {
                                      TextField("الاسم الأجنبي (Jon)", text: $newGlossaryOrig)
                                          .autocapitalization(.none)
                                      TextField("المقابل العربي (جون)", text: $newGlossaryRep)
                                      Button("إضافة") {
                                          if !newGlossaryOrig.isEmpty && !newGlossaryRep.isEmpty {
                                              vm.glossary.append(GlossaryItem(original: newGlossaryOrig, replacement: newGlossaryRep))
                                              newGlossaryOrig = ""
                                              newGlossaryRep = ""
                                          }
                                      }
                                  }
                                  ForEach(vm.glossary) { g in
                                      HStack {
                                          Text(g.original).bold()
                                          Image(systemName: "arrow.left")
                                          Text(g.replacement).foregroundColor(.blue)
                                      }
                                  }
                                  .onDelete { idx in vm.glossary.remove(atOffsets: idx) }
                              }

                              Section(header: Text("الترجمة الذكية بالذكاء الاصطناعي (Gemini AI 🧠)")) {
                                  Toggle("تفعيل ترجمة السياق الذكية (Gemini)", isOn: $vm.useGeminiAI)
                                  SecureField("أدخل مفتاح Gemini API المجاني (اختياري)", text: $vm.geminiApiKey)
                                      .autocapitalization(.none)
                              }

                              Section(header: Text("سرعة التمرير التلقائي للمانجا")) {
                                  HStack {
                                      Text("السرعة: \(String(format: "%.1f", vm.scrollSpeed))")
                                      Slider(value: $vm.scrollSpeed, in: 0.5...5.0, step: 0.5)
                                  }
                              }
                          }
                          .navigationTitle("الإعدادات والألوان والسرعة ⚙️")
                          .toolbar { Button("تم") { showSettingsSheet = false } }
                      }
                      .navigationViewStyle(StackNavigationViewStyle())
                  }
              }
          }
          EOF

      - name: Build and Package IPA
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project GameTranslatorUltra.xcodeproj \
            clean build \
            -scheme GameTranslatorUltra \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            TARGETED_DEVICE_FAMILY="1,2" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          cp -r "$APP_PATH" Payload/
          codesign --force --deep --sign - Payload/GameTranslatorUltra.app
          zip -r -y GameTranslatorUltra.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ready-GameTranslatorUltra-IPA
          path: GameTranslatorUltra.ipa
